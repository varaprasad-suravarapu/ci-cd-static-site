<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-gray-900 text-white shadow-md">
        <div class="mx-auto max-w-6xl px-6 py-5">
            <h1 class="text-2xl font-bold">My Website</h1>
        </div>
    </header>

    <!-- Contact Section -->
    <main class="mx-auto max-w-6xl px-6 py-16">

        <div class="mx-auto max-w-2xl rounded-2xl bg-white p-8 text-center shadow-lg">

            <h2 class="text-4xl font-bold text-gray-900">
                Contact Us
            </h2>

            <p class="mt-4 text-lg leading-8 text-gray-600">
                Welcome to our contact page. We'd love to hear from you.
                Feel free to get in touch with us.
            </p>

            <div class="mt-8 overflow-hidden rounded-xl">
                <img
                    src="contact.jpg"
                    alt="Contact us"
                    class="h-64 w-full object-cover"
                >
            </div>

            <a
                href="index.html"
                class="mt-8 inline-block rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white transition hover:bg-blue-700"
            >
                Back to Home
            </a>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 py-6 text-center text-white">
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
