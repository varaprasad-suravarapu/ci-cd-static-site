name: Static Site CI

on:
  push:
    branches:
      - main
    
    pull_request:
      branches:
        - maingit s

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes htmlhint "*.html"